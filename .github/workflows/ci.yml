name: CI

on:
  push:
    branches: [main]
  pull_request:

# First ship is macOS (see AGENTS.md). Workspace builds on Linux, but some
# Device/bridge integration tests currently fail there (EBADF); keep CI on macOS.
jobs:
  rust:
    name: fmt / check / test / clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
