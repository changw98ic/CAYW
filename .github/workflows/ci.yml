name: CI

on:
  push:
    branches: [main]
  pull_request:

# First ship targets macOS (see AGENTS.md); run the required checks on macOS.
# The Linux job verifies the same Rust workspace builds, lints, and tests on
# Ubuntu. It is not desktop product support: Pty terminals, Git read
# capabilities, and other macOS-only tests stay cfg-gated to macOS.
jobs:
  rust:
    name: fmt / check / test / clippy
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            crates/cayw-visual-editor/framework/package-lock.json
            crates/cayw-pi-compat/npm/package-lock.json

      - name: Install editor companion dependencies
        run: npm ci --prefix crates/cayw-visual-editor/framework --no-fund --no-audit

      - name: Install Pi adapter dependencies
        run: npm ci --prefix crates/cayw-pi-compat/npm --omit=dev --no-fund --no-audit

      - name: WebUI regression tests
        run: node --test crates/cayw-webui/tests/*.test.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-linux:
    name: linux / fmt / check / test / clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            crates/cayw-visual-editor/framework/package-lock.json
            crates/cayw-pi-compat/npm/package-lock.json

      - name: Show C/C++ toolchain
        run: |
          cc --version
          c++ --version

      - name: Install editor companion dependencies
        run: npm ci --prefix crates/cayw-visual-editor/framework --no-fund --no-audit

      - name: Install Pi adapter dependencies
        run: npm ci --prefix crates/cayw-pi-compat/npm --omit=dev --no-fund --no-audit

      - name: WebUI regression tests
        run: node --test crates/cayw-webui/tests/*.test.mjs

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --workspace --all-targets --locked

      - name: cargo test
        run: cargo test --workspace --locked

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  runtime-product:
    name: macOS / product features / crash recovery
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Record candidate and platform
        run: |
          git rev-parse HEAD
          sw_vers
          uname -m

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/cayw-pi-compat/npm/package-lock.json

      - name: Install Pi adapter dependencies
        run: npm ci --prefix crates/cayw-pi-compat/npm --omit=dev --no-fund --no-audit

      # This is an explicit optional-product combination, not the shipped
      # four-binary bundle (which intentionally enables only plugins).
      - name: Check optional product features
        id: product-check
        run: cargo check -p cayw-runtime --all-targets --locked --features plugins,strongflow,pi-compat,remote

      - name: Test optional product features
        run: cargo test -p cayw-runtime --locked --features plugins,strongflow,pi-compat,remote

      - name: Lint optional product features
        if: ${{ !cancelled() && steps.product-check.outcome == 'success' }}
        run: cargo clippy -p cayw-runtime --all-targets --locked --features plugins,strongflow,pi-compat,remote -- -D warnings

      # These suites must not silently run zero tests under default features.
      # All fixtures are local/offline; no real model credentials are supplied.
      - name: Test crash and persistence recovery
        if: ${{ !cancelled() && steps.product-check.outcome == 'success' }}
        run: >-
          cargo test -p cayw-runtime --locked
          --features plugins,strongflow,pi-compat,remote,fault-injection
          --test crash_recovery_matrix --test crash_reconciliation
          --test refactor_process_recovery --test worker_panic
          --test content_recovery --test result_externalization --test result_sources

      - name: Lint fault-injection targets
        if: ${{ !cancelled() && steps.product-check.outcome == 'success' }}
        run: cargo clippy -p cayw-runtime --all-targets --locked --features plugins,strongflow,pi-compat,remote,fault-injection -- -D warnings

  release-install:
    name: macOS arm64 / package / install / upgrade
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Require supported release target
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          git rev-parse HEAD
          sw_vers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Test installer failures with synthetic binaries
        run: |
          python3 scripts/test-install-cli.py
          python3 scripts/test_install_cli.py

      # The license generator intentionally resolves metadata offline. Prepare
      # both locked workspaces first, including dependencies outside the binary
      # build closure, so a fresh runner does not depend on a warmed Cargo cache.
      - name: Fetch locked release dependencies
        run: |
          cargo fetch --locked --target aarch64-apple-darwin
          cargo fetch --locked --target aarch64-apple-darwin --manifest-path examples/headless-client/Cargo.toml

      - name: Build exact release bundle
        run: sh scripts/package-cli.sh "$RUNNER_TEMP/cayw-release"

      # The bundle build resolves and caches its locked dependency closure.
      # Check both synthetic license policies and actual metadata offline.
      - name: Test third-party notices
        run: python3 scripts/test-generate-third-party-notices.py

      # upload-artifact normalizes file permissions. Keep executable modes
      # inside a tarball and accept the extracted distribution, not the build tree.
      - name: Archive and extract the release distribution
        run: |
          tar -czf "$RUNNER_TEMP/cayw-macos-arm64.tar.gz" -C "$RUNNER_TEMP" cayw-release
          (cd "$RUNNER_TEMP" && shasum -a 256 cayw-macos-arm64.tar.gz > cayw-macos-arm64.tar.gz.sha256)
          mkdir "$RUNNER_TEMP/cayw-distribution"
          tar -xzf "$RUNNER_TEMP/cayw-macos-arm64.tar.gz" -C "$RUNNER_TEMP/cayw-distribution"

      - name: Validate clean install and upgrade with distributed binaries
        run: python3 scripts/validate-release-install.py "$RUNNER_TEMP/cayw-distribution/cayw-release" "$RUNNER_TEMP/cayw-release-evidence"

      - name: Preserve release bundle and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-release-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/cayw-macos-arm64.tar.gz
            ${{ runner.temp }}/cayw-macos-arm64.tar.gz.sha256
            ${{ runner.temp }}/cayw-release-evidence
          if-no-files-found: warn
          retention-days: 7
