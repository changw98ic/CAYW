[workspace]
resolver = "3"
members = [
    "crates/cayw-ai",
    "crates/cayw-agent",
    "crates/cayw-core",
    "crates/cayw-device",
    "crates/cayw-codemode",
    "crates/cayw-host",
    "crates/cayw-ipc",
    "crates/cayw-runtime",
    "crates/cayw-providers",
    "crates/cayw-plugins",
    "crates/cayw-fusion-plugin",
    "crates/cayw-remote",
    "crates/cayw-content",
    "crates/cayw-tui",
    "crates/cayw-webui",
    "crates/cayw-data",
    "crates/cayw-verify-tool",
    "crates/cayw-workspace",
    "crates/cayw-bridge",
    "crates/cayw-cells",
    "crates/cayw-requests",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/changw98ic/CAYW"

[workspace.dependencies]
cayw-ai = { path = "crates/cayw-ai", version = "0.1.0" }
async-trait = "0.1"
async-stream = "0.3"
futures = "0.3"
jsonschema = { version = "0.59", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
