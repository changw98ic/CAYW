[package]
name = "cayw-plugins"
description = "Explicit native and external plugins, workflow decisions and observation for CAYW hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["strongflow", "observer", "evaluation"]
strongflow = []
observer = []
jev = []
fusion = ["dep:sha2"]
evaluation = ["jev", "fusion"]

[dependencies]
cayw-ai.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid = { version = "1", features = ["v4"] }
tokio = { workspace = true, features = ["process", "io-util", "signal"] }
tokio-util.workspace = true
sha2 = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", default-features = false, features = ["process", "signal"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "fs"] }

[[bin]]
name = "cayw-plugin-fixture"
path = "tests/fixtures/external.rs"

[[bin]]
name = "cayw-plugin-strongflow"
path = "src/bin/cayw-plugin-strongflow.rs"
required-features = ["strongflow"]

[[example]]
name = "offline_plugins"
required-features = ["strongflow", "observer", "evaluation"]
