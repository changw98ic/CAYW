[package]
name = "cayw-visual-editor"
description = "Optional visual source editor for existing CAYW project pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cayw-visual-editor"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
axum.workspace = true
cap-fs-ext.workspace = true
cap-std.workspace = true
cayw-ai.workspace = true
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
cayw-host = { path = "../cayw-host", version = "0.1.0" }
html5gum.workspace = true
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt-multi-thread", "signal", "time"] }
