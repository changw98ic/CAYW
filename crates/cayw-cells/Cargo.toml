[package]
name = "cayw-cells"
description = "CAYW durable bounded CodeMode cells and single AgentTool entry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cayw-ai.workspace = true
cayw-agent = { path = "../cayw-agent", version = "0.1.0" }
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
async-trait.workspace = true
base64 = "=0.22.1"
fs2 = "=0.4.3"
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio.workspace = true
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
futures.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
