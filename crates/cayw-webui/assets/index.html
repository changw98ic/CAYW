<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>CAYW</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#conversation">跳到对话</a>
  <header class="topbar">
    <div class="identity"><span class="mark" aria-hidden="true">C</span><strong>CAYW</strong></div>
    <div class="connection"><span id="connection-status" role="status">尚未连接</span><button id="logout" class="quiet" hidden>退出登录</button></div>
  </header>

  <div id="network-notice" role="status"></div>
  <section id="login-panel" class="login-panel" aria-labelledby="login-heading">
    <h1 id="login-heading">开始对话</h1>
    <p id="login-description" class="muted">这台电脑上会直接进入。从其他设备打开时，如果设置了账号，用账号密码登录。</p>
    <form id="login-form">
      <div id="account-fields" hidden>
        <label for="username">账号</label><input id="username" type="text" autocomplete="username" maxlength="80">
        <label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="1024">
      </div>
      <button id="login-button" type="submit">进入</button>
    </form>
    <p id="login-error" class="error" role="alert"></p>
  </section>

  <div id="workspace" class="app" hidden>
    <aside class="sidebar" aria-labelledby="sessions-heading">
      <section class="workspace-switcher" aria-label="工作区">
        <label for="workspace-choice">工作区</label>
        <select id="workspace-choice"></select>
        <div class="switch-row"><button id="switch-workspace" type="button">打开</button><button id="refresh-workspaces" type="button" class="quiet">刷新</button></div>
        <p id="workspace-switch-status" class="small muted" role="status"></p>
      </section>
      <div class="section-heading"><h2 id="sessions-heading">对话</h2><button id="refresh-sessions" class="quiet" type="button">刷新</button></div>
      <form id="create-form" class="create-form">
        <label for="session-label" class="small">新对话</label>
        <div class="create-row"><input id="session-label" type="text" maxlength="160" required placeholder="给这段对话起个名字"><button id="create-button" type="submit">新建</button></div>
      </form>
      <p id="list-status" class="small muted" role="status"></p>
      <nav id="session-list" class="session-list" aria-label="选择对话"></nav>
    </aside>

    <main id="conversation" class="conversation" tabindex="-1">
      <div class="conversation-heading">
        <h1 id="session-title">选择或新建一段对话</h1>
        <span id="session-state" class="state-label">等待选择</span>
      </div>
      <p id="global-error" class="error" role="alert" hidden></p>
      <p id="poll-status" class="small muted" role="status"></p>
      <section id="blocked-notice" class="notice" hidden>
        <p id="blocked-text"></p>
        <button id="open-fork" type="button" hidden>另开一段普通对话</button>
      </section>
      <section class="history-section" aria-label="对话内容">
        <p id="history-note" class="small muted"></p>
        <div id="messages" class="messages"><div class="empty"><h2>开始对话</h2><p>左边选一段已有的，或新建一段。</p></div></div>
        <section id="live-section" class="live-section" aria-label="正在回复" hidden><h2 class="small">正在回复</h2><pre id="live-text"></pre></section>
      </section>
      <form id="prompt-form" class="composer">
        <label for="prompt" class="visually-hidden">发送消息</label>
        <textarea id="prompt" rows="3" maxlength="64000" placeholder="说你要做的事" disabled></textarea>
        <div class="composer-footer"><span id="prompt-status" class="small muted" role="status">选好对话后就能输入。Enter 换行，Ctrl 或 ⌘ 加 Enter 发送。</span><div class="composer-actions"><button id="cancel-button" class="secondary" type="button" disabled>停止</button><button id="send-button" type="submit" disabled>发送</button></div></div>
      </form>
    </main>
  </div>

  <dialog id="fork-dialog" aria-labelledby="fork-heading">
    <h2 id="fork-heading">另开一段普通对话</h2>
    <p>当前这段先停在这里，记录还在。确认后会新建一段可以继续说的对话。</p>
    <form id="fork-form">
      <label for="fork-label">新对话的名字</label>
      <input id="fork-label" maxlength="160" required>
      <label class="confirm-label"><input id="fork-confirm" type="checkbox" required>我确认另开一段，原来的对话保持停住。</label>
      <p id="fork-error" class="error" role="alert"></p>
      <div class="dialog-actions"><button id="close-fork" class="secondary" type="button">返回</button><button id="fork-button" type="submit">另开</button></div>
    </form>
  </dialog>
  <noscript><p class="notice">这个页面需要 JavaScript 才能对话。请打开 JavaScript 后刷新。</p></noscript>
</body>
</html>
