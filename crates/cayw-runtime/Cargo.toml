[package]
name = "cayw-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless runtime integrating durable sessions, bounded Luau tools and local IPC"

[features]
default = []
modules = ["dep:cayw-modules"]
strongflow = ["modules", "cayw-modules/strongflow"]
remote = ["dep:cayw-remote"]

[dependencies]
async-trait.workspace = true
async-stream.workspace = true
cayw-ai.workspace = true
cayw-agent = { path = "../cayw-agent", version = "0.1.0" }
cayw-core = { path = "../cayw-core", version = "0.1.0" }
cayw-cells = { path = "../cayw-cells", version = "0.1.0" }
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
cayw-bridge = { path = "../cayw-bridge", version = "0.1.0" }
cayw-host = { path = "../cayw-host", version = "0.1.0" }
cayw-ipc = { path = "../cayw-ipc", version = "0.1.0" }
cayw-requests = { path = "../cayw-requests", version = "0.1.0" }
cayw-modules = { path = "../cayw-modules", version = "0.1.0", default-features = false, optional = true }
cayw-remote = { path = "../cayw-remote", version = "0.1.0", optional = true }
futures.workspace = true
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "signal", "io-util", "process"] }
tokio-util.workspace = true
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cayw"
path = "src/main.rs"

[[bin]]
name = "cayw-runtime-process-fixture"
path = "tests/fixtures/process.rs"
test = false
doc = false

[[bin]]
name = "cayw-runtime-module-fixture"
path = "tests/fixtures/external.rs"
required-features = ["modules"]
test = false
doc = false
