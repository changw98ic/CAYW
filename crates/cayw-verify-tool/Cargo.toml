[package]
name = "cayw-verify-tool"
description = "Offline SDK/IPC fault validation and real Luau capability measurements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
cayw-ai.workspace = true
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
cayw-core = { path = "../cayw-core", version = "0.1.0" }
cayw-host = { path = "../cayw-host", version = "0.1.0" }
cayw-ipc = { path = "../cayw-ipc", version = "0.1.0" }
cayw-runtime = { path = "../cayw-runtime", version = "0.1.0", default-features = false }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10.9"
tokio = { workspace = true, features = ["net", "io-util", "process"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
