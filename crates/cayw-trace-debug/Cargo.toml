[package]
name = "cayw-trace-debug"
description = "Optional local trace graph and bounded node replay plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
axum = { version = "=0.8.4", default-features = false, features = ["http1", "json", "tokio"] }
cayw-ai.workspace = true
cayw-agent = { path = "../cayw-agent" }
cayw-codemode = { path = "../cayw-codemode" }
cayw-core = { path = "../cayw-core" }
cayw-codeintel.workspace = true
cayw-run-inspector.workspace = true
cayw-ipc = { path = "../cayw-ipc" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread", "signal"] }
tokio-util.workspace = true
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
cayw-runtime = { path = "../cayw-runtime" }
cayw-cells = { path = "../cayw-cells" }
tempfile = "3"
reqwest.workspace = true

[[bin]]
name = "cayw-trace-debug"
path = "src/main.rs"
