[package]
name = "cayw-requests"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/changw98ic/CAYW"
description = "Durable task-scoped capability requests with host evaluation and exact permission checks"

[dependencies]
async-trait = "0.1"
cayw-ai = { path = "../cayw-ai", version = "0.1.0" }
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
cayw-host = { path = "../cayw-host", version = "0.1.0" }
cayw-queue = { path = "../cayw-queue", version = "0.1.0" }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
