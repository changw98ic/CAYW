[package]
name = "cayw-sources"
description = "Explicit local host MCP stdio connections and Markdown Skill file sources"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait.workspace = true
cayw-ai.workspace = true
cayw-bridge = { path = "../cayw-bridge", version = "0.1.0" }
cayw-codemode = { path = "../cayw-codemode", version = "0.1.0" }
cayw-workspace = { path = "../cayw-workspace", version = "0.1.0" }
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
uuid = { version = "=1.27.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "cayw-sources-local-fixture"
path = "../cayw-bridge/src/bin/local_mcp_fixture.rs"
