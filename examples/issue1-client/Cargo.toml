[package]
name = "issue1-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

# This executable is a downstream client, outside the product workspace.
[workspace]
members = ["."]
resolver = "3"

[dependencies]
async-trait = "0.1"
cayw-ai = { path = "../../crates/cayw-ai" }
cayw-agent = { path = "../../crates/cayw-agent" }
cayw-core = { path = "../../crates/cayw-core" }
cayw-codemode = { path = "../../crates/cayw-codemode" }
cayw-host = { path = "../../crates/cayw-host" }
cayw-ipc = { path = "../../crates/cayw-ipc" }
cayw-runtime = { path = "../../crates/cayw-runtime", default-features = false }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "sync", "time", "process"] }

[dev-dependencies]
tempfile = "3"
